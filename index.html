<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <h1>Gerenciador de tarefas</h1>
    
    <div class="container">
    <input type="text" id="input-tarefa" placeholder="Digite o nome da tarefa">
    <button id="btn-adicionar">Adicionar</button>
    </div>


    <div id="contador">
        <p>Total: <span id="Total">0</span></p>
        <p>Pendentes: <span id="Pendentes">0</span></p>
        <p>Concluidas: <span id="Concluidas">0</span></p>
    </div>

    <div id="filtros">
        <button id="btn-todas">Todas</button>
        <button id="btn-pendentes">Pendentes</button>
        <button id="btn-concluidas">Concluidas</button>
    </div>
   
    
    <ul id="lista-tarefas">
    </ul>

<script src="script.js"></script>
</body>
</html>
